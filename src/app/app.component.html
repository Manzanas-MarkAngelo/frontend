<div class="min-h-screen flex items-center justify-center bg-gray-100">
  <div class="bg-white p-6 rounded-lg shadow-lg w-96">
    <h1 class="text-2xl font-bold text-center mb-4">Encryption & Decryption</h1>

    <div class="mb-4">
      <label for="message" class="block text-sm font-medium text-gray-700">Enter your message</label>
      <input id="message" type="text" [(ngModel)]="message" class="mt-2 p-2 w-full border rounded-md" placeholder="Type your message" />
    </div>

    <div class="mb-4">
      <button (click)="encryptMessage()" class="w-full bg-blue-500 text-white p-2 rounded-md hover:bg-blue-600">Encrypt Message</button>
    </div>

    <div *ngIf="encryptedMessage" class="mb-4">
      <label for="encrypted" class="block text-sm font-medium text-gray-700">Encrypted Message</label>
      <input id="encrypted" type="text" [(ngModel)]="encryptedMessage" readonly class="mt-2 p-2 w-full border rounded-md bg-gray-200" />
    </div>

    <div *ngIf="encryptedMessage">
      <label for="key" class="block text-sm font-medium text-gray-700">Enter decryption key</label>
      <input id="key" type="text" [(ngModel)]="userKey" class="mt-2 p-2 w-full border rounded-md" placeholder="Enter the key" />

      <button (click)="decryptMessage()" class="w-full bg-green-500 text-white p-2 rounded-md hover:bg-green-600 mt-2">Decrypt Message</button>

      <div *ngIf="validationMessage" class="mt-2 text-red-500 text-sm text-center">
        {{ validationMessage }}
      </div>

      <div *ngIf="decryptedMessage" class="mt-4">
        <label for="decrypted" class="block text-sm font-medium text-gray-700">Decrypted Message</label>
        <input id="decrypted" type="text" [(ngModel)]="decryptedMessage" readonly class="mt-2 p-2 w-full border rounded-md bg-gray-200" />
      </div>
    </div>
  </div>
</div>
